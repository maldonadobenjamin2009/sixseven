name: Initialize Supabase schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SSL: "true"
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::Configurá SUPABASE_DATABASE_URL y SUPABASE_URL como repository secrets."
            exit 1
          fi
          echo "Se encontraron las variables. Sus valores no se mostrarán."
      - name: Initialize tables, Auth trigger and courses
        run: npm run db:init
