name: Validate JavaScript and PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sixseven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sixseven_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sixseven_test
      DB_SSL: "false"
      SESSION_SECRET: ci-only-session-secret-for-tests
      PORT: "3101"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Initialize PostgreSQL schema
        run: npm run db:init
      - name: Exercise login, CRUD, attendance, duplicate protection and reports
        run: npm run test:integration
